name: Publish verified Full update channel
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smartvoice-full-published-channel
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && contains(github.event.release.tag_name, '-TJ-Full'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public release before updating the small channel file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,glob,hashlib,json,os,re,subprocess,tempfile,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          REPO='UMEDJON12/smartvoice-tj-updates'
          CERT='5d1d676dfddad74da47b5486b4dbe9bf66b68e67c7c256d144ec0bdf3f0ed95b'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          API='https://api.github.com/repos/'+REPO
          def api(path,method='GET',data=None,attempts=4):
              last=None
              for attempt in range(attempts):
                  try:
                      request=urllib.request.Request(API+path,method=method,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=60) as r:
                          body=r.read();return json.loads(body) if body else None
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code==429 or 500<=e.code<600:
                          time.sleep(5*(3**attempt));continue
                      raise
                  except (urllib.error.URLError,TimeoutError) as e:
                      last=e
                      if attempt==attempts-1:break
                      time.sleep(5*(3**attempt))
              raise last
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  u=urllib.parse.urlsplit(newurl)
                  assert u.scheme=='https' and u.username is None and (u.port is None or u.port==443)
                  assert u.hostname in ('github.com','release-assets.githubusercontent.com','objects.githubusercontent.com','github-releases.githubusercontent.com')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SafeRedirect())
          def download(asset,path,limit):
              # Release-asset CDN occasionally answers 504; gh uses the API asset
              # endpoint instead and is retried with backoff.
              name=asset['name'];u=asset['browser_download_url'];assert u.startswith('https://github.com/'+REPO+'/releases/download/')
              tag=u.split('/releases/download/')[1].split('/')[0]
              last=None
              for attempt in range(4):
                  try:
                      with tempfile.TemporaryDirectory() as td:
                          r=subprocess.run(['gh','release','download',tag,'--repo',REPO,'--pattern',name,'--dir',td,'--clobber'],capture_output=True,text=True)
                          if r.returncode:raise RuntimeError((r.stderr or r.stdout).strip()[:400])
                          data=(Path(td)/name).read_bytes()
                      if len(data)!=asset['size'] or 'sha256:'+hashlib.sha256(data).hexdigest()!=asset['digest']:raise RuntimeError('asset size/digest mismatch')
                      if len(data)>limit:raise RuntimeError('asset exceeds limit')
                      path.write_bytes(data);return
                  except Exception as e:
                      last=e;print('download attempt',attempt+1,'failed:',e)
                      if attempt<3:time.sleep(5*(3**attempt))
              raise last

          if os.environ.get('GITHUB_EVENT_NAME')=='release':
              event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              target=event['release']
              if target['draft'] or target['prerelease'] or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-TJ-Full',target['tag_name']):print('not-a-full-release');raise SystemExit(0)
              release=api('/releases/'+str(target['id']))
          else:
              candidates=[r for r in api('/releases?per_page=100') if not r['draft'] and not r['prerelease'] and re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-TJ-Full',r['tag_name'])]
              if not candidates:print('no-full-release');raise SystemExit(0)
              release=max(candidates,key=lambda r:tuple(map(int,r['tag_name'][1:].split('-')[0].split('.'))))
          assert not release['draft'] and not release['prerelease']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-TJ-Full',release['tag_name'])
          assets={a['name']:a for a in release['assets']}
          assert 'update-full.json' in assets and assets['update-full.json']['state']=='uploaded'
          with tempfile.TemporaryDirectory(prefix='sv-public-channel-') as td:
              root=Path(td);metadata=root/'update-full.json';download(assets['update-full.json'],metadata,65536);data=json.loads(metadata.read_text())
              assert data['schemaVersion']==1 and data['testOnly'] is False and data['variant']=='full'
              assert data['packageName']=='tts.smartvoice.umedjon.full' and data['signingCertificateSha256']==CERT
              assert data['versionCode']>0 and release['tag_name']=='v'+data['versionName']
              filename=data['apkFileName'];assert re.fullmatch(r'SmartVoice[-A-Za-z0-9_.]+\.apk',filename)
              asset=assets[filename];assert asset['state']=='uploaded'
              assert data['sizeBytes']==asset['size'] and asset['digest']=='sha256:'+data['sha256']
              assert data['apkUrl']=='https://github.com/'+REPO+'/releases/download/'+release['tag_name']+'/'+filename
              apk=root/filename;download(asset,apk,data['sizeBytes'])
              def sdk(name):
                  matches=sorted(glob.glob(os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk')+'/build-tools/*/'+name),reverse=True);assert matches;return matches[0]
              signature=subprocess.check_output([sdk('apksigner'),'verify','--print-certs',str(apk)],text=True)
              assert re.findall(r'certificate SHA-256 digest: ([a-fA-F0-9]+)',signature)==[CERT]
              badging=subprocess.check_output([sdk('aapt'),'dump','badging',str(apk)],text=True)
              match=re.search(r"package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",badging)
              assert match and match.group(1)==data['packageName'] and int(match.group(2))==data['versionCode'] and match.group(3)==data['versionName']
              assert int(re.search(r"sdkVersion:'([0-9]+)'",badging).group(1))==data['minSdk']
          assert not api('/releases/'+str(release['id']))['draft']
          data.update(ready=True,tagName=release['tag_name'],publishedAt=release['published_at'])
          def put_content(path,obj,message,attempts=5):
              encoded=base64.b64encode((json.dumps(obj,ensure_ascii=False,indent=2)+'\n').encode()).decode()
              last=None
              for attempt in range(attempts):
                  body={'message':message,'branch':'main','content':encoded}
                  try:
                      try:body['sha']=api(path+'?ref=main')['sha']
                      except urllib.error.HTTPError as e:
                          if e.code!=404:raise
                      return api(path,'PUT',body)
                  except urllib.error.HTTPError as e:
                      last=e
                      if not (e.code in (409,422) or e.code==429 or 500<=e.code<600):raise
                  except (urllib.error.URLError,TimeoutError) as e:
                      last=e
                  time.sleep(3*(attempt+1))
              raise last
          path='/contents/updates/full.json'
          previous=None
          try:previous=api(path+'?ref=main')
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          if previous:
              old=json.loads(base64.b64decode(previous['content']))
              if old.get('versionCode',0)>data['versionCode']:raise SystemExit('Newer Full channel already present')
              if old.get('versionCode')==data['versionCode'] and old.get('sha256')==data['sha256']:
                  print(json.dumps({'fullChannelAlreadyCurrent':True,'versionName':data['versionName']}));raise SystemExit(0)
          put_content(path,data,'Publish verified SmartVoice '+data['versionName']+' update channel')
          print(json.dumps({'ready':True,'versionName':data['versionName'],'versionCode':data['versionCode'],'releaseId':release['id'],'publicApkDownloadedAndVerified':True}))
          PY
