name: Publish verified update channel
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['.github/workflows/publish-update-channel.yml']
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send one TEST notification to standard-app subscribers (no release)'
        type: boolean
        required: true
        default: false
      send_real_notification:
        description: 'Send one REAL announcement for the latest verified release'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: smartvoice-published-channel
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public release before updating the small channel file
        id: publish_channel
        if: github.event_name != 'workflow_dispatch' || inputs.test_notification != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,glob,hashlib,json,os,re,subprocess,tempfile,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          REPO='UMEDJON12/smartvoice-tj-updates'
          CERT='5d1d676dfddad74da47b5486b4dbe9bf66b68e67c7c256d144ec0bdf3f0ed95b'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          API='https://api.github.com/repos/'+REPO
          def api(path,method='GET',data=None,attempts=4):
              last=None
              for attempt in range(attempts):
                  try:
                      request=urllib.request.Request(API+path,method=method,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=60) as r:
                          body=r.read();return json.loads(body) if body else None
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code==429 or 500<=e.code<600:
                          time.sleep(5*(3**attempt));continue
                      raise
                  except (urllib.error.URLError,TimeoutError) as e:
                      last=e
                      if attempt==attempts-1:break
                      time.sleep(5*(3**attempt))
              raise last
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  u=urllib.parse.urlsplit(newurl)
                  assert u.scheme=='https' and u.username is None and (u.port is None or u.port==443)
                  assert u.hostname in ('github.com','release-assets.githubusercontent.com','objects.githubusercontent.com','github-releases.githubusercontent.com')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SafeRedirect())
          def download(asset,path,limit):
              # Release-asset CDN occasionally answers 504; gh uses the API asset
              # endpoint instead and is retried with backoff.
              name=asset['name'];u=asset['browser_download_url'];assert u.startswith('https://github.com/'+REPO+'/releases/download/')
              tag=u.split('/releases/download/')[1].split('/')[0]
              last=None
              for attempt in range(4):
                  try:
                      with tempfile.TemporaryDirectory() as td:
                          r=subprocess.run(['gh','release','download',tag,'--repo',REPO,'--pattern',name,'--dir',td,'--clobber'],capture_output=True,text=True)
                          if r.returncode:raise RuntimeError((r.stderr or r.stdout).strip()[:400])
                          data=(Path(td)/name).read_bytes()
                      if len(data)!=asset['size'] or 'sha256:'+hashlib.sha256(data).hexdigest()!=asset['digest']:raise RuntimeError('asset size/digest mismatch')
                      if len(data)>limit:raise RuntimeError('asset exceeds limit')
                      path.write_bytes(data);return
                  except Exception as e:
                      last=e;print('download attempt',attempt+1,'failed:',e)
                      if attempt<3:time.sleep(5*(3**attempt))
              raise last

          release=api('/releases/latest')
          if os.environ.get('GITHUB_EVENT_NAME')=='release':
              event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              target=event['release']
              if target['draft'] or target['prerelease']:raise SystemExit('Preview does not update the stable channel')
              for attempt in range(10):
                  if release['id']==target['id']:break
                  time.sleep(3);release=api('/releases/latest')
              if release['id']!=target['id']:raise SystemExit('Published release is not latest; stable channel retained')
          assert not release['draft'] and not release['prerelease']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-TJ',release['tag_name'])
          assets={a['name']:a for a in release['assets']}
          assert 'update.json' in assets and assets['update.json']['state']=='uploaded'
          with tempfile.TemporaryDirectory(prefix='sv-public-channel-') as td:
              root=Path(td);metadata=root/'update.json';download(assets['update.json'],metadata,65536);data=json.loads(metadata.read_text())
              assert data['schemaVersion']==1 and data['testOnly'] is False and data['variant']=='standard'
              assert data['packageName']=='tts.smartvoice.umedjon' and data['signingCertificateSha256']==CERT
              assert data['versionCode']>0 and release['tag_name']=='v'+data['versionName']
              filename=data['apkFileName'];assert re.fullmatch(r'SmartVoice[-A-Za-z0-9_.]+\.apk',filename)
              asset=assets[filename];assert asset['state']=='uploaded'
              assert data['sizeBytes']==asset['size'] and asset['digest']=='sha256:'+data['sha256']
              assert data['apkUrl']=='https://github.com/'+REPO+'/releases/download/'+release['tag_name']+'/'+filename
              apk=root/filename;download(asset,apk,data['sizeBytes'])
              def sdk(name):
                  matches=sorted(glob.glob(os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk')+'/build-tools/*/'+name),reverse=True);assert matches;return matches[0]
              signature=subprocess.check_output([sdk('apksigner'),'verify','--print-certs',str(apk)],text=True)
              assert re.findall(r'certificate SHA-256 digest: ([a-fA-F0-9]+)',signature)==[CERT]
              badging=subprocess.check_output([sdk('aapt'),'dump','badging',str(apk)],text=True)
              match=re.search(r"package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",badging)
              assert match and match.group(1)==data['packageName'] and int(match.group(2))==data['versionCode'] and match.group(3)==data['versionName']
              assert int(re.search(r"sdkVersion:'([0-9]+)'",badging).group(1))==data['minSdk']
          assert api('/releases/latest')['id']==release['id'],'Latest changed during verification; keep previous channel'
          data.update(ready=True,tagName=release['tag_name'],publishedAt=release['published_at'])
          def put_content(path,obj,message,attempts=5):
              encoded=base64.b64encode((json.dumps(obj,ensure_ascii=False,indent=2)+'\n').encode()).decode()
              last=None
              for attempt in range(attempts):
                  body={'message':message,'branch':'main','content':encoded}
                  try:
                      try:body['sha']=api(path+'?ref=main')['sha']
                      except urllib.error.HTTPError as e:
                          if e.code!=404:raise
                      return api(path,'PUT',body)
                  except urllib.error.HTTPError as e:
                      last=e
                      if not (e.code in (409,422) or e.code==429 or 500<=e.code<600):raise
                  except (urllib.error.URLError,TimeoutError) as e:
                      last=e
                  time.sleep(3*(attempt+1))
              raise last
          current=None
          try:current=json.loads(base64.b64decode(api('/contents/updates/stable.json?ref=main')['content']))
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          if current and current.get('versionCode')==data['versionCode'] and current.get('sha256')==data['sha256'] and current.get('apkUrl')==data['apkUrl']:
              print(json.dumps({'channelAlreadyCurrent':True,'versionName':data['versionName'],'versionCode':data['versionCode']}))
          else:
              put_content('/contents/updates/stable.json',data,'Publish verified SmartVoice '+data['versionName']+' update channel')
              print(json.dumps({'ready':True,'versionName':data['versionName'],'versionCode':data['versionCode'],'releaseId':release['id'],'publicApkDownloadedAndVerified':True}))
          PY

      - name: Authenticate only the release workflow for FCM
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        id: fcm_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1074074358850/locations/global/workloadIdentityPools/smartvoice-github/providers/github-release
          service_account: smartvoice-release-notifier@smartvoice-updates.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Send an announcement after verified publication
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test_notification != true)
        env:
          FCM_ACCESS_TOKEN: ${{ steps.fcm_auth.outputs.access_token }}
          VALIDATE_ONLY: ${{ github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.send_real_notification != true) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,json,os,time,urllib.error,urllib.request
          from pathlib import Path
          API='https://api.github.com/repos/UMEDJON12/smartvoice-tj-updates'
          def api(path,method='GET',data=None):
              req=urllib.request.Request(API+path,method=method,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read();return json.loads(body) if body else None
          def put_content(path,obj,message,attempts=5):
              encoded=base64.b64encode((json.dumps(obj,ensure_ascii=False,indent=2)+'\n').encode()).decode()
              last=None
              for attempt in range(attempts):
                  body={'message':message,'branch':'main','content':encoded}
                  try:
                      try:body['sha']=api(path+'?ref=main')['sha']
                      except urllib.error.HTTPError as e:
                          if e.code!=404:raise
                      return api(path,'PUT',body)
                  except urllib.error.HTTPError as e:
                      last=e
                      if not (e.code in (409,422) or e.code==429 or 500<=e.code<600):raise
                  except (urllib.error.URLError,TimeoutError) as e:
                      last=e
                  time.sleep(3*(attempt+1))
              raise last
          channel=api('/contents/updates/stable.json?ref=main')
          data=json.loads(base64.b64decode(channel['content']))
          assert data['ready'] is True and data['testOnly'] is False and data['variant']=='standard' and data['packageName']=='tts.smartvoice.umedjon'
          release=api('/releases/latest')
          assert not release['draft'] and not release['prerelease'] and release['tag_name']=='v'+data['versionName']
          if os.environ.get('GITHUB_EVENT_NAME')=='release':
              event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text());assert event['release']['id']==release['id']
          validate=os.environ['VALIDATE_ONLY']=='true'
          if not validate:
              assert os.environ.get('GITHUB_REF')=='refs/heads/main' or os.environ.get('GITHUB_EVENT_NAME')=='release','Real announcement is allowed only from main or a published release'
              delivery=None
              try:delivery=json.loads(base64.b64decode(api('/contents/checks/push-delivery.json?ref=main')['content']))
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              if delivery and delivery.get('versionCode')==data['versionCode'] and delivery.get('state')=='accepted' and delivery.get('acceptedByFcm'):
                  print(json.dumps({'alreadyAnnounced':True,'versionCode':data['versionCode'],'previousRunId':delivery.get('runId')}))
                  raise SystemExit(0)
              if delivery and delivery.get('versionCode')==data['versionCode'] and delivery.get('state')=='intent' and delivery.get('runId')!=os.environ['GITHUB_RUN_ID']:
                  raise SystemExit('Предыдущая попытка отправки не подтверждена; повторная массовая рассылка запрещена')
              put_content('/contents/checks/push-delivery.json',{'state':'intent','versionName':data['versionName'],'versionCode':data['versionCode'],'validateOnly':False,'runId':os.environ['GITHUB_RUN_ID'],'startedAt':int(time.time())},'Record FCM announcement intent')
          payload={'validate_only':validate,'message':{'topic':'smartvoice-standard','android':{'priority':'HIGH','ttl':'604800s','collapse_key':'smartvoice-release'},'data':{'schema':'1','kind':'smartvoice-update','packageName':data['packageName'],'variant':data['variant'],'versionCode':str(data['versionCode']),'versionName':data['versionName'],'minSdk':str(data['minSdk'])}}}
          req=urllib.request.Request('https://fcm.googleapis.com/v1/projects/smartvoice-updates/messages:send',method='POST',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['FCM_ACCESS_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
          report={'state':'validated' if validate else 'accepted','versionName':data['versionName'],'versionCode':data['versionCode'],'validateOnly':validate,'acceptedByFcm':True,'deviceDeliveryConfirmed':False,'messageName':result.get('name',''),'runId':os.environ['GITHUB_RUN_ID']}
          put_content('/contents/checks/push-validation.json' if validate else '/contents/checks/push-delivery.json',report,'Record FCM announcement validation' if validate else 'Record accepted SmartVoice update announcement')
          print(json.dumps(report))
          PY


      - name: Send one explicitly requested test notification
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification == true
        env:
          FCM_ACCESS_TOKEN: ${{ steps.fcm_auth.outputs.access_token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          API='https://api.github.com/repos/UMEDJON12/smartvoice-tj-updates'
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert os.environ['GITHUB_REPOSITORY']=='UMEDJON12/smartvoice-tj-updates'
          assert os.environ['GITHUB_REF']=='refs/heads/main'
          payload={'validate_only':False,'message':{'topic':'smartvoice-standard','notification':{'title':'Тестовое уведомление SmartVoice','body':'Это проверка уведомлений. Новая версия для этого теста не выпускалась.'},'android':{'priority':'HIGH','ttl':'600s','notification':{'channel_id':'SmartVoiceReleaseAnnouncements','tag':'smartvoice-test'}}}}
          req=urllib.request.Request('https://fcm.googleapis.com/v1/projects/smartvoice-updates/messages:send',method='POST',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['FCM_ACCESS_TOKEN'],'Content-Type':'application/json'})
          # Deliberately no retry: an ambiguous timeout must not duplicate a broadcast.
          with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
          assert result.get('name','').startswith('projects/smartvoice-updates/messages/')
          report={'kind':'test-notification','topic':'smartvoice-standard','validateOnly':False,'acceptedByFcm':True,'deviceDeliveryConfirmed':False,'messageName':result['name'],'runId':os.environ['GITHUB_RUN_ID'],'ttlSeconds':600}
          def api(path,method='GET',data=None):
              req=urllib.request.Request(API+path,method=method,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read();return json.loads(body) if body else None
          path='/contents/checks/push-test.json';body={'message':'Record explicitly requested test notification','branch':'main','content':base64.b64encode((json.dumps(report,indent=2)+'\n').encode()).decode()}
          try:body['sha']=api(path+'?ref=main')['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          api(path,'PUT',body);print(json.dumps(report))
          PY
